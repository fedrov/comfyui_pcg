<svg xmlns="http://www.w3.org/2000/svg" width="690" height="324" viewBox="0 0 690 324" role="img" aria-label="COP image layers and ComfyUI images" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>COP image layers and ComfyUI images</title>
<rect width="690" height="324" rx="10" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6672"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="40" y="60" width="190" height="130" rx="6" fill="#e9d2c5" stroke="#1d2127" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-size="13" fill="#1d2127" text-anchor="start" font-weight="650">C  (3 ch)</text>
<rect x="66" y="82" width="190" height="130" rx="6" fill="#d8d8d8" stroke="#1d2127" stroke-width="1.2"/>
<text x="76.0" y="102.0" font-size="13" fill="#1d2127" text-anchor="start" font-weight="650">height  (1 ch)</text>
<rect x="92" y="104" width="190" height="130" rx="6" fill="#c7cdf3" stroke="#1d2127" stroke-width="1.2"/>
<text x="102.0" y="124.0" font-size="13" fill="#1d2127" text-anchor="start" font-weight="650">N  (3 ch)</text>
<rect x="118" y="126" width="190" height="130" rx="6" fill="#e9e9e9" stroke="#1d2127" stroke-width="1.2"/>
<text x="128.0" y="146.0" font-size="13" fill="#1d2127" text-anchor="start" font-weight="650">mask  (1 ch)</text>
<text x="150.0" y="40.0" font-size="14" fill="#1d2127" text-anchor="middle" font-weight="650">COPIMAGE: named layers, one resolution</text>
<line x1="330.0" y1="160.0" x2="440.0" y2="160.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="385.0" y="150.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">To Image</text>
<text x="385.0" y="182.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">From Image</text>
<line x1="440.0" y1="172.0" x2="330.0" y2="172.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="460" y="90" width="170" height="120" rx="4" fill="#f4f6f9" stroke="#5d6672"/>
<rect x="472" y="102" width="170" height="120" rx="4" fill="#f4f6f9" stroke="#5d6672"/>
<rect x="484" y="114" width="170" height="120" rx="4" fill="#f4f6f9" stroke="#5d6672"/>
<text x="560.0" y="175.0" font-size="13" fill="#1d2127" text-anchor="middle" font-weight="650">RGB</text>
<text x="560.0" y="70.0" font-size="14" fill="#1d2127" text-anchor="middle" font-weight="650">ComfyUI IMAGE: a batch of RGB</text>
<text x="345.0" y="288.0" font-size="13" fill="#5d6672" text-anchor="middle" font-weight="400">COP nodes read and write layers by name (C, height, N, mask ...); bridges convert to the</text>
<text x="345.0" y="306.0" font-size="13" fill="#5d6672" text-anchor="middle" font-weight="400">IMAGE / MASK types that the rest of ComfyUI uses.</text>
</g>
</svg>

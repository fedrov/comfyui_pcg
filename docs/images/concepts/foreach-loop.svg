<svg xmlns="http://www.w3.org/2000/svg" width="710" height="305" viewBox="0 0 710 305" role="img" aria-label="For-Each loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>For-Each loop</title>
<rect width="710" height="305" rx="10" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6672"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="30" y="120" width="150" height="54" rx="8" fill="#eaf2fa" stroke="#2f7fc1"/>
<text x="105.0" y="143.0" font-size="14" fill="#1d2127" text-anchor="middle" font-weight="650">For-Each Begin</text>
<text x="105.0" y="162.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">split by piece</text>
<rect x="250" y="50" width="210" height="50" rx="8" fill="#ffffff" stroke="#c9ced6"/>
<text x="355.0" y="71.0" font-size="13" fill="#1d2127" text-anchor="middle" font-weight="600">loop body · iteration 0</text>
<text x="355.0" y="89.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">piece 0</text>
<line x1="182.0" y1="147.0" x2="248.0" y2="75.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="462.0" y1="75.0" x2="528.0" y2="147.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="250" y="120" width="210" height="50" rx="8" fill="#ffffff" stroke="#c9ced6"/>
<text x="355.0" y="141.0" font-size="13" fill="#1d2127" text-anchor="middle" font-weight="600">loop body · iteration 1</text>
<text x="355.0" y="159.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">piece 1</text>
<line x1="182.0" y1="147.0" x2="248.0" y2="145.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="462.0" y1="145.0" x2="528.0" y2="147.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="250" y="190" width="210" height="50" rx="8" fill="#ffffff" stroke="#c9ced6"/>
<text x="355.0" y="211.0" font-size="13" fill="#1d2127" text-anchor="middle" font-weight="600">loop body · iteration 2</text>
<text x="355.0" y="229.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">piece 2 …</text>
<line x1="182.0" y1="147.0" x2="248.0" y2="215.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="462.0" y1="215.0" x2="528.0" y2="147.0" stroke="#5d6672" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="530" y="120" width="150" height="54" rx="8" fill="#eaf2fa" stroke="#2f7fc1"/>
<text x="605.0" y="143.0" font-size="14" fill="#1d2127" text-anchor="middle" font-weight="650">For-Each End</text>
<text x="605.0" y="162.0" font-size="12" fill="#5d6672" text-anchor="middle" font-weight="400">merge (or feedback)</text>
<text x="355.0" y="268.0" font-size="13" fill="#5d6672" text-anchor="middle" font-weight="400">The body runs once per piece / number / count; End gathers the results.</text>
<text x="355.0" y="287.0" font-size="13" fill="#5d6672" text-anchor="middle" font-weight="400">Feedback passes each result to the next iteration instead.</text>
</g>
</svg>
